# === Pane Border Status ===
set -g pane-border-status top
# Border colors
set -g pane-border-style 'fg=colour237'
set -g pane-active-border-style 'fg=colour214'        # Warm gold/orange for active border
# Pane status text — orange/gold when active
set -g pane-border-format "#{?pane_active,#[fg=colour214],#[fg=colour246]} #{pane_index} #[fg=colour45]#{pane_title} #[fg=colour240]| #{?pane_active,#[fg=colour214],#[fg=colour250]}#{s|^$HOME|~|:pane_current_path}#[default]"
