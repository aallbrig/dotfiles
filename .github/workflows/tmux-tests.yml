name: Tmux Configuration Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - '.tmux.conf'
      - 'scripts/test-tmux.sh'
      - 'Taskfile.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.tmux.conf'
      - 'scripts/test-tmux.sh'
      - 'Taskfile.yml'

jobs:
  test-tmux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install tmux and shellcheck
      run: sudo apt-get update && sudo apt-get install -y tmux shellcheck

    - name: Shellcheck all shell scripts
      run: ./scripts/lint-shell.sh

    - name: Run tmux configuration tests
      run: ./scripts/test-tmux.sh
