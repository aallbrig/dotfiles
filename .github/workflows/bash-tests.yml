name: Bash Configuration Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - '.bashrc'
      - '.bash_profile'
      - 'scripts/test-bashrc.sh'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.bashrc'
      - '.bash_profile'
      - 'scripts/test-bashrc.sh'

jobs:
  test-bash:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    
    - name: Run bash configuration tests
      run: ./scripts/test-bashrc.sh
