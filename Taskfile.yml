version: '3'

tasks:
  # --- One command for everything CI runs ---
  ci:
    desc: Run every quality gate (same as GitHub Actions lint job)
    cmds:
      - pre-commit run --all-files --hook-stage manual
      - sh scripts/test-all.sh

  # --- Git hooks ---
  hooks:install:
    desc: Install pre-commit, commit-msg and pre-push git hooks
    cmds:
      - pre-commit install --install-hooks

  hooks:update:
    desc: Bump pinned hook revisions to their latest releases
    cmds:
      - pre-commit autoupdate

  test-startup:
    desc: Start interactive zsh/bash and fail on stderr noise; report startup time
    cmds:
      - ./scripts/test-startup.sh

  # --- Secrets ---
  secrets-staged:
    desc: Scan staged files for leaked secrets (pre-commit)
    cmds:
      - gitleaks git --staged

  secrets-history:
    desc: Scan full git history for leaked secrets
    cmds:
      - gitleaks git

  # --- Linting ---
  lint:
    desc: Run all linters (pre-commit, all files)
    cmds:
      - pre-commit run --all-files

  lint-shell:
    desc: Shellcheck all shell scripts in the repo
    cmds:
      - ./scripts/lint-shell.sh

  lint-shell-staged:
    desc: Shellcheck only shell scripts staged for commit
    cmds:
      - ./scripts/lint-shell-staged.sh

  # --- CI tasks (runnable locally) ---
  test-zshrc:
    desc: Test .zshrc syntax and structure
    cmds:
      - ./scripts/test-zshrc.sh

  test-bashrc:
    desc: Test .bashrc/.bash_profile syntax and structure
    cmds:
      - ./scripts/test-bashrc.sh

  test-scripts:
    desc: Test install/uninstall scripts
    cmds:
      - ./scripts/test-scripts.sh

  test-posix:
    desc: Run POSIX compliance checks on .profile/.aliases/.functions
    cmds:
      - ./scripts/test-posix.sh

  test-vim:
    desc: Test .vimrc
    cmds:
      - ./scripts/test-vim.sh

  test-gitconfig:
    desc: Test .gitconfig
    cmds:
      - ./scripts/test-gitconfig.sh

  test-tmux:
    desc: Validate .tmux.conf syntax and config load
    cmds:
      - ./scripts/test-tmux.sh

  # --- Pre-commit (composite) ---
  precommit:
    desc: Run the pre-commit hooks against staged files
    cmds:
      - pre-commit run
