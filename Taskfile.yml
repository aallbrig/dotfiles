version: '3'

tasks:
  # --- Secrets ---
  secrets-staged:
    desc: Scan staged files for leaked secrets (pre-commit)
    cmds:
      - gitleaks git --staged

  secrets-history:
    desc: Scan full git history for leaked secrets
    cmds:
      - gitleaks git

  # --- Linting ---
  lint:
    desc: Run all linters
    cmds:
      - task: lint-shell

  lint-shell:
    desc: Shellcheck all shell scripts in the repo
    cmds:
      - ./scripts/lint-shell.sh

  lint-shell-staged:
    desc: Shellcheck only shell scripts staged for commit
    cmds:
      - ./scripts/lint-shell-staged.sh

  # --- CI tasks (runnable locally) ---
  test-zshrc:
    desc: Test .zshrc syntax and structure
    cmds:
      - ./scripts/test-zshrc.sh

  test-scripts:
    desc: Test install/uninstall scripts
    cmds:
      - ./scripts/test-scripts.sh

  test-posix:
    desc: Run POSIX compliance checks on .profile/.aliases/.functions
    cmds:
      - ./scripts/test-posix.sh

  test-vim:
    desc: Test .vimrc
    cmds:
      - ./scripts/test-vim.sh

  test-gitconfig:
    desc: Test .gitconfig
    cmds:
      - ./scripts/test-gitconfig.sh

  test-tmux:
    desc: Validate .tmux.conf syntax and config load
    cmds:
      - ./scripts/test-tmux.sh

  # --- Pre-commit (composite) ---
  precommit:
    desc: Run all pre-commit checks (secrets scan + staged shell lint + tmux config)
    cmds:
      - task: secrets-staged
      - task: lint-shell-staged
      - task: test-tmux
